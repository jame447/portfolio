<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 840" width="1240" height="840" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .border { fill: none; stroke: #1e293b; stroke-width: 2; }
      .wire { fill: none; stroke: #0f172a; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .wire-vcc { fill: none; stroke: #dc2626; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
      .wire-gnd { fill: none; stroke: #0f172a; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
      .wire-sig { fill: none; stroke: #2563eb; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .wire-vref { fill: none; stroke: #7c3aed; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .wire-btn { fill: none; stroke: #059669; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .comp { fill: #ffffff; stroke: #0f172a; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .ic-body { fill: #f8fafc; stroke: #0f172a; stroke-width: 2.4; stroke-linejoin: round; }
      .sensor-zone { fill: #fffbeb; stroke: #d97706; stroke-width: 2.2; stroke-dasharray: 8 5; rx: 10; }
      .sensor-box { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2; rx: 4; }
      .pcb-plate { fill: #d97706; stroke: #78350f; stroke-width: 1.5; }
      .bean { fill: #b45309; stroke: #78350f; stroke-width: 1; }
      .btn-zone { fill: #ecfdf5; stroke: #059669; stroke-width: 1.8; stroke-dasharray: 7 5; rx: 8; }
      .box { fill: #f8fafc; stroke: #64748b; stroke-width: 1.5; rx: 6; }
      .port { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.8; rx: 4; }
      .port-btn { fill: #ecfdf5; stroke: #059669; stroke-width: 1.8; rx: 4; }
      .tp { fill: #ffffff; stroke: #0f172a; stroke-width: 2; }
      .junc { fill: #0f172a; }
      .junc-vcc { fill: #dc2626; }
      .junc-sig { fill: #2563eb; }
      .junc-vref { fill: #7c3aed; }
      .junc-btn { fill: #059669; }
      .lbl { font-size: 13px; fill: #0f172a; font-weight: 600; }
      .lbl-sm { font-size: 11px; fill: #475569; }
      .lbl-pin { font-size: 11px; fill: #334155; font-weight: 700; }
      .lbl-net { font-size: 12px; font-weight: 700; }
      .lbl-vcc { font-size: 13px; fill: #dc2626; font-weight: 700; }
      .lbl-cx { font-size: 12px; fill: #b45309; font-weight: 700; }
      .lbl-btn { font-size: 12px; fill: #047857; font-weight: 700; }
      .title { font-size: 16px; fill: #0f172a; font-weight: 700; }
      .subtitle { font-size: 12px; fill: #475569; }
    </style>
  </defs>

  <!-- Sheet Background & Frame -->
  <rect class="bg" x="0" y="0" width="1240" height="840"/>
  <rect class="border" x="16" y="16" width="1208" height="808"/>

  <!-- Header Banner -->
  <text class="title" x="36" y="46">ESP32 + LM393 Coffee Bean Moisture Sensor Schematic (3-Slot PCB Capacitive Box)</text>
  <text class="subtitle" x="36" y="65">Synced with esp32_coffee_moisture_meter.ino — Day 2 Competition Circuit (TESA TOP GUN RALLY 2026 Track 1)</text>

  <!-- ==================== POWER & GROUND RAILS ==================== -->
  <!-- +3.3V Rail (y = 100) -->
  <line class="wire-vcc" x1="120" y1="100" x2="1140" y2="100"/>
  <circle class="junc-vcc" cx="120" cy="100" r="4"/>
  <text class="lbl-vcc" x="62" y="104">+3.3V</text>

  <!-- GND Rail (y = 635) -->
  <line class="wire-gnd" x1="120" y1="635" x2="1140" y2="635"/>
  <circle class="junc" cx="120" cy="635" r="4"/>
  <text class="lbl" x="68" y="639">GND</text>
  <!-- Ground Symbol at x=1140 -->
  <line class="wire-gnd" x1="1140" y1="635" x2="1140" y2="650"/>
  <line class="wire-gnd" x1="1126" y1="650" x2="1154" y2="650"/>
  <line class="wire-gnd" x1="1131" y1="656" x2="1149" y2="656"/>
  <line class="wire-gnd" x1="1136" y1="662" x2="1144" y2="662"/>

  <!-- ==================== ESP32 CHARGE INPUT & R1 (1M) ==================== -->
  <!-- ESP32 GPIO 18 Port -->
  <rect class="port" x="36" y="182" width="146" height="36"/>
  <text class="lbl" x="46" y="200">ESP32 GPIO 18</text>
  <text class="lbl-sm" x="46" y="213">PIN_CHARGE (OUT)</text>

  <!-- Wire from GPIO 18 to R1 -->
  <line class="wire-sig" x1="182" y1="200" x2="225" y2="200"/>

  <!-- R1: 1 MOhm Horizontal Resistor (x = 225..305, y = 200) -->
  <polyline class="comp" points="225,200 232,190 244,210 256,190 268,210 280,190 292,210 299,200"/>
  <line class="wire-sig" x1="299" y1="200" x2="305" y2="200"/>
  <text class="lbl" x="238" y="176">R1 = 1 MΩ</text>
  <text class="lbl-sm" x="232" y="228">(Charge Resistor)</text>

  <!-- Wire from R1 to Vc Node (x=395, y=200) -->
  <line class="wire-sig" x1="305" y1="200" x2="515" y2="200"/>
  <circle class="junc-sig" cx="395" cy="200" r="4.5"/>
  <text class="lbl-net" fill="#2563eb" x="405" y="191">Vc (Sensor Charge Node)</text>

  <!-- Route Vc down and right to LM393 IN1- (Pin 2 at x=575, y=270) -->
  <polyline class="wire-sig" points="515,200 515,270 575,270"/>

  <!-- ==================== COFFEE BEAN PCB CAPACITIVE SENSOR BOX ==================== -->
  <rect class="sensor-zone" x="280" y="255" width="218" height="295"/>
  <text class="lbl-cx" x="294" y="276">COFFEE MOISTURE SENSOR (Csensor)</text>
  <text class="lbl-sm" x="294" y="292">กล่องพลาสติก 3 ช่อง + แผ่นปรินซ์ 5×10 cm</text>
  <text class="lbl-sm" x="294" y="306">ช่องว่างเมล็ดกาแฟ d = 1.0 cm (εr ≈ 2..80)</text>

  <!-- Top Terminal J1.1 (+) from Vc -->
  <line class="wire-sig" x1="395" y1="200" x2="395" y2="328"/>
  <circle class="tp" cx="395" cy="328" r="5"/>
  <text class="lbl-pin" x="407" y="332">J1.1 (Plate + / Vc)</text>

  <!-- Plastic 3-Slot Sensor Box Graphic (Top-Down / Cross-Section View) -->
  <rect class="sensor-box" x="322" y="352" width="134" height="132"/>

  <!-- Left PCB Plate (Slot 1 - Connected to Vc or GND depending on 2/3 plate mode) -->
  <rect class="pcb-plate" x="332" y="360" width="8" height="116"/>
  <!-- Center / Right PCB Plate (Slot 2/3) -->
  <rect class="pcb-plate" x="440" y="360" width="8" height="116"/>

  <!-- Wire from J1.1 (+) to Left PCB Copper Plate -->
  <polyline class="wire-sig" points="395,333 395,343 336,343 336,360"/>

  <!-- Coffee Beans Dielectric Representation between plates -->
  <ellipse class="bean" cx="362" cy="380" rx="9" ry="6" transform="rotate(-15 362 380)"/>
  <ellipse class="bean" cx="390" cy="378" rx="9" ry="6" transform="rotate(20 390 378)"/>
  <ellipse class="bean" cx="418" cy="382" rx="9" ry="6" transform="rotate(-10 418 382)"/>
  <ellipse class="bean" cx="356" cy="404" rx="9" ry="6" transform="rotate(25 356 404)"/>
  <ellipse class="bean" cx="386" cy="402" rx="9" ry="6" transform="rotate(-20 386 402)"/>
  <ellipse class="bean" cx="415" cy="406" rx="9" ry="6" transform="rotate(15 415 406)"/>
  <ellipse class="bean" cx="364" cy="428" rx="9" ry="6" transform="rotate(-12 364 428)"/>
  <ellipse class="bean" cx="393" cy="427" rx="9" ry="6" transform="rotate(18 393 427)"/>
  <ellipse class="bean" cx="420" cy="430" rx="9" ry="6" transform="rotate(-25 420 430)"/>
  <ellipse class="bean" cx="358" cy="454" rx="9" ry="6" transform="rotate(10 358 454)"/>
  <ellipse class="bean" cx="388" cy="452" rx="9" ry="6" transform="rotate(-15 388 452)"/>
  <ellipse class="bean" cx="416" cy="455" rx="9" ry="6" transform="rotate(22 416 455)"/>

  <!-- Dimension Callout -->
  <text class="lbl-pin" fill="#1e3a8a" x="348" y="498">C = C_empty + ΔC_coffee</text>

  <!-- Wire from Right PCB Copper Plate to J1.2 (-) -->
  <polyline class="wire-gnd" points="444,476 444,507 395,507 395,518"/>
  <circle class="tp" cx="395" cy="518" r="5"/>
  <text class="lbl-pin" x="407" y="523">J1.2 (Plate - / GND)</text>

  <!-- J1.2 to GND Rail -->
  <line class="wire-gnd" x1="395" y1="523" x2="395" y2="635"/>
  <circle class="junc" cx="395" cy="635" r="4"/>

  <!-- ==================== 10k TRIMPOT (RV1) FOR Vref ==================== -->
  <!-- +3.3V drop to RV1 Pin 1 (x=180, y=315) -->
  <line class="wire-vcc" x1="180" y1="100" x2="180" y2="315"/>
  <circle class="junc-vcc" cx="180" cy="100" r="4"/>
  <text class="lbl-pin" x="145" y="317">Pin 1</text>

  <!-- RV1 Vertical Resistor Body (x=180, y=315..440) -->
  <line class="wire" x1="180" y1="315" x2="180" y2="328"/>
  <polyline class="comp" points="180,328 170,336 190,348 170,360 190,372 170,384 190,396 170,408 190,420 180,427"/>
  <line class="wire" x1="180" y1="427" x2="180" y2="440"/>

  <!-- RV1 Pin 3 to GND -->
  <text class="lbl-pin" x="145" y="445">Pin 3</text>
  <line class="wire-gnd" x1="180" y1="440" x2="180" y2="635"/>
  <circle class="junc" cx="180" cy="635" r="4"/>

  <!-- RV1 Labels -->
  <text class="lbl" x="68" y="368">RV1 = 10 kΩ</text>
  <text class="lbl-sm" x="68" y="384">Trimpot (Vref)</text>
  <text class="lbl-sm" x="68" y="400">Tune ≈ 1.65 V</text>

  <!-- RV1 Wiper (Pin 2) Arrow & Vref Net -->
  <line class="wire-vref" x1="220" y1="378" x2="193" y2="378"/>
  <polygon fill="#7c3aed" points="191,378 201,373 201,383"/>
  <text class="lbl-pin" x="198" y="368">Pin 2 (Wiper)</text>

  <!-- Route Vref cleanly under Sensor Box (y=580) up to LM393 IN1+ (Pin 3 at x=575, y=350) -->
  <polyline class="wire-vref" points="220,378 250,378 250,580 515,580 515,350 575,350"/>
  <text class="lbl-net" fill="#7c3aed" x="262" y="572">Vref (≈ 1.65 V)</text>

  <!-- Optional Test Point TP_VREF for test_trimpot10k.ino (GPIO 34) -->
  <circle class="junc-vref" cx="250" cy="580" r="4"/>
  <line class="wire-vref" x1="250" y1="580" x2="250" y2="604"/>
  <circle class="tp" cx="250" cy="604" r="4.5"/>
  <text class="lbl-sm" x="125" y="608">TP_VREF (to GPIO 34 tune)</text>

  <!-- ==================== U1A: LM393 VOLTAGE COMPARATOR ==================== -->
  <!-- Triangle Body (x=575..715, y=225..395, apex=715,310) -->
  <polygon class="ic-body" points="575,225 575,395 715,310"/>

  <!-- Comparator Inputs (- on top = Pin 2, + on bottom = Pin 3) -->
  <text class="lbl" x="587" y="275">−</text>
  <text class="lbl-pin" x="540" y="264">Pin 2</text>
  <text class="lbl-sm" x="603" y="275">IN1-</text>

  <text class="lbl" x="587" y="355">+</text>
  <text class="lbl-pin" x="540" y="344">Pin 3</text>
  <text class="lbl-sm" x="603" y="355">IN1+</text>

  <!-- IC Designator -->
  <text class="lbl" x="613" y="310">U1A</text>
  <text class="lbl-sm" x="608" y="325">LM393</text>

  <!-- Power Pins: Pin 8 (VCC) & Pin 4 (GND) -->
  <line class="wire-vcc" x1="637" y1="100" x2="637" y2="262"/>
  <circle class="junc-vcc" cx="637" cy="100" r="4"/>
  <text class="lbl-pin" x="644" y="246">Pin 8 (VCC)</text>

  <line class="wire-gnd" x1="637" y1="358" x2="637" y2="635"/>
  <circle class="junc" cx="637" cy="635" r="4"/>
  <text class="lbl-pin" x="644" y="382">Pin 4 (GND)</text>

  <!-- Output Pin 1 (OUT1) -->
  <line class="wire-sig" x1="715" y1="310" x2="815" y2="310"/>
  <text class="lbl-pin" x="721" y="302">Pin 1</text>
  <circle class="junc-sig" cx="765" cy="310" r="4.5"/>

  <!-- ==================== R2: OUT1 PULL-UP RESISTOR (10k or 2k) ==================== -->
  <circle class="junc-vcc" cx="765" cy="100" r="4"/>
  <line class="wire-vcc" x1="765" y1="100" x2="765" y2="160"/>
  <polyline class="comp" points="765,160 755,167 775,179 755,191 775,203 755,215 775,227 765,234"/>
  <line class="wire-sig" x1="765" y1="234" x2="765" y2="310"/>
  <text class="lbl" x="782" y="192">R2 = 10 kΩ (or 2 kΩ)</text>
  <text class="lbl-sm" x="782" y="208">(OUT1 Open-Collector</text>
  <text class="lbl-sm" x="782" y="223">Pull-up to +3.3V)</text>

  <!-- ESP32 GPIO 19 Output Port -->
  <rect class="port" x="815" y="292" width="148" height="36"/>
  <text class="lbl" x="825" y="310">ESP32 GPIO 19</text>
  <text class="lbl-sm" x="825" y="323">PIN_COMP_OUT (IN)</text>

  <!-- ==================== SENSOR PLATE CONFIGURATION BOX ==================== -->
  <rect class="box" x="688" y="410" width="275" height="165"/>
  <text class="lbl" x="702" y="432">3-Slot PCB Box Wiring Options:</text>
  <text class="lbl-sm" x="702" y="452">• Option A (2 PCB Plates — Slide 8):</text>
  <text class="lbl-sm" x="712" y="469">Slot 1 (Left) → J1.1 (Vc)</text>
  <text class="lbl-sm" x="712" y="485">Slot 3 (Right) → J1.2 (GND) [or Slot 2]</text>
  <text class="lbl-sm" x="702" y="507">• Option B (3 PCB Plates — Shielded 2×C):</text>
  <text class="lbl-sm" x="712" y="524">Slot 2 (Center Plate) → J1.1 (Vc)</text>
  <text class="lbl-sm" x="712" y="540">Slot 1 &amp; Slot 3 (Outer Plates) → J1.2 (GND)</text>
  <text class="lbl-sm" fill="#047857" x="702" y="560">* Hold SW1 ≥ 2.5s (Empty Box) = Auto ZERO C_empty</text>

  <!-- ==================== PUSH BUTTON TRIGGER (GPIO 23 INTERNAL PULLUP) ==================== -->
  <rect class="btn-zone" x="980" y="338" width="224" height="190"/>
  <text class="lbl-btn" x="994" y="358">TRIGGER &amp; HW DEBOUNCE</text>

  <!-- ESP32 GPIO 23 Port (Internal INPUT_PULLUP ~45 kOhm) -->
  <rect class="port-btn" x="995" y="205" width="192" height="52"/>
  <text class="lbl" x="1007" y="224">ESP32 GPIO 23</text>
  <text class="lbl-sm" x="1007" y="239">PIN_BUTTON (INPUT_PULLUP)</text>
  <text class="lbl-sm" x="1007" y="252">Short=Measure | Hold 2.5s=ZERO</text>

  <!-- Wire down from GPIO 23 to split node (1058, 375) -->
  <line class="wire-btn" x1="1058" y1="257" x2="1058" y2="375"/>

  <!-- Split at (1058, 375) to SW1 (x=1020) and C1 (x=1110) -->
  <circle class="junc-btn" cx="1058" cy="375" r="4"/>
  <line class="wire-btn" x1="1020" y1="375" x2="1110" y2="375"/>

  <!-- SW1: Momentary Push Button (NO) at x=1020, y=375..475 -->
  <line class="wire-btn" x1="1020" y1="375" x2="1020" y2="410"/>
  <circle class="tp" cx="1020" cy="410" r="3.5"/>
  <circle class="tp" cx="1020" cy="452" r="3.5"/>
  <!-- Tactile switch bridge & plunger -->
  <line class="wire" x1="1004" y1="406" x2="1004" y2="456"/>
  <line class="wire" x1="992" y1="431" x2="1004" y2="431"/>
  <line class="wire-gnd" x1="1020" y1="455" x2="1020" y2="635"/>
  <circle class="junc" cx="1020" cy="635" r="4"/>
  <text class="lbl" x="992" y="486">SW1</text>
  <text class="lbl-sm" x="992" y="501">Push Btn</text>
  <text class="lbl-sm" x="992" y="515">(Active LOW)</text>

  <!-- C1: 0.1 uF Hardware Debounce Cap at x=1110, y=375..635 -->
  <line class="wire-btn" x1="1110" y1="375" x2="1110" y2="424"/>
  <line class="wire" x1="1092" y1="424" x2="1128" y2="424"/>
  <line class="wire" x1="1092" y1="438" x2="1128" y2="438"/>
  <line class="wire-gnd" x1="1110" y1="438" x2="1110" y2="635"/>
  <circle class="junc" cx="1110" cy="635" r="4"/>
  <text class="lbl" x="1132" y="427">C1 = 0.1 µF</text>
  <text class="lbl-sm" x="1132" y="443">HW Debounce</text>
  <text class="lbl-sm" x="1132" y="457">(Slide 21)</text>

  <!-- ==================== BOM & TITLE BLOCK ==================== -->
  <rect class="box" x="36" y="672" width="725" height="128"/>
  <text class="lbl" x="50" y="694">Bill of Materials &amp; Sensor Principle (Day 2 Coffee Bean Moisture Meter):</text>
  <text class="lbl-sm" x="50" y="714">• Sensor Box: 3-Slot Plastic Container + 5 cm × 10 cm Copper PCB Plates (1.0 cm bean gap) connected to J1.1 (Vc) &amp; J1.2 (GND)</text>
  <text class="lbl-sm" x="50" y="732">• U1: LM393 Dual Comparator (DIP-8, Inverting Mode)   • RV1: 10 kΩ Trimpot (Vref ≈ 1.65 V)   • R1: 1 MΩ (RC Charge from GPIO 18)</text>
  <text class="lbl-sm" x="50" y="750">• R2: 10 kΩ or 2 kΩ (LM393 OUT1 Pull-up to +3.3V)   • SW1 + C1 (0.1 µF): Trigger Button to GPIO 23 (Internal INPUT_PULLUP)</text>
  <text class="lbl-sm" x="50" y="768">• Dielectric Physics: Dry Coffee (εr ≈ 2–4) vs Water (εr ≈ 80) → Higher moisture increases ΔC = C_bean − C_empty → Mapped via PWL/OLS</text>
  <text class="lbl-sm" x="50" y="786">• Serial Output (9600 baud): "TGR-51" / "Moisture Level = xx.xx %" + 200 ms Onboard LED (GPIO 2) pulse on every button press</text>

  <rect class="box" x="775" y="672" width="429" height="128"/>
  <text class="lbl" x="791" y="695">TGR 2026 Track 1 — Day 2 Moisture Schematic</text>
  <text class="lbl-sm" x="791" y="715">Synced Firmware: esp32_coffee_moisture_meter.ino</text>
  <text class="lbl-sm" x="791" y="733">  PIN_CHARGE=18, PIN_COMP_OUT=19, PIN_BUTTON=23, PIN_LED=2</text>
  <text class="lbl-sm" x="791" y="751">Commands: CAL, ZERO, PROBE, EQ a,b, SET, BASIS, MODE, SHOW</text>
  <text class="lbl-sm" x="791" y="769">Models: PWL / LIN (M = a*C + b, R² ≥ 0.95) / QUAD + C0 Comp</text>
  <text class="lbl-sm" x="791" y="787">Supply: 3.3 V (ESP32 DevKit V1) | Sheet 2 of 2</text>
</svg>
